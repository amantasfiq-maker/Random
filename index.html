<!DOCTYPE html>
<html>
<head>
    <title>Apology</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: radial-gradient(circle, #0f172a, #020617);
            color: white;
            text-align: center;
            margin: 0;
            padding-top: 90px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            width: 260px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            margin-left: 6px;
            cursor: pointer;
            background: #38bdf8;
            color: black;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
        }

        #output {
            margin-top: 35px;
            font-size: 20px;
            min-height: 100px;
            white-space: pre-line;
        }

        .footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow:
                0 0 10px #38bdf8,
                0 0 20px #38bdf8,
                0 0 40px #38bdf8;
            animation: pulse 1.5s infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.08); opacity: 1; }
        }
    </style>
</head>

<body>

<h2>Enter your trait 💭</h2>

<input id="traitInput" placeholder="kind, smart, funny..." />
<button onclick="checkTrait()">Submit</button>

<div id="output"></div>

<div class="footer">
    ⚡ Presented by Tasfiq ⚡
</div>

<script>
function checkTrait() {
    let trait = document.getElementById("traitInput").value.trim();
    let output = document.getElementById("output");

    if (trait === "") {
        typeText("Say something first 😒");
        return;
    }

    let message = 
`Onne i don’t care, I was not angry and still like you 💙

Onne ami Lamiyar bepare kichu bolate mon kharap korini.
Ar apnakeo kichu change korte hobe na. Ami nijei vul korechilam sorry 🥹.
You are perfect as you are. Apni sudhu Lamiya ke niye keno je kauke niye bolte paren — ami eita moja pai 😄`;

    typeText(message);
}

function typeText(text) {
    let output = document.getElementById("output");
    output.innerHTML = "";

    let i = 0;
    let interval = setInterval(() => {
        output.innerHTML += text[i];
        i++;
        if (i >= text.length) clearInterval(interval);
    }, 25);
}
</script>

</body>
</html>
